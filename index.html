<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOL Bubi Élő Térkép</title>

    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <!-- Saját CSS -->
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <div id="bubi-warning"
        style="background-color: #ffcc00; color: #333; text-align: center; padding: 15px 40px 15px 20px; font-family: sans-serif; font-weight: bold; z-index: 10000; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; border-radius: 8px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        ⚠️ Figyelem: Az átmeneti MOL Bubi flottaváltás miatt az élő adatok jelenleg nem elérhetőek. Az alkalmazás
        frissül, amint a szolgáltatás visszatér!
        <span
            style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.5em; line-height: 1;"
            onclick="this.parentElement.style.display='none';">&times;</span>
    </div>

    <button id="darkModeToggle">
        <svg id="moonIcon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Saját JS fájlok -->
    <script src="scripts/app.js"></script>

</body>

</html>
